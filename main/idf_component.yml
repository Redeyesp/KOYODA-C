dependencies:
  waveshare/esp32_s3_touch_amoled_1_75:
    version: "3.0.1"
  lvgl/lvgl:
    version: "9.4.*"
    public: true
  # WebSocket client for the xiaozhi backend. This is NOT a built-in
  # ESP-IDF component (it was moved to the component registry), so it
  # must be declared here rather than in CMakeLists REQUIRES.
  espressif/esp_websocket_client:
    version: "~1.7.0"
  # Opus encoder/decoder (Phase 2). Same components xiaozhi-esp32 uses.
  espressif/esp_audio_codec:
    version: "~2.5.0"
  # Sample-rate conversion 22050 <-> 16000.
  espressif/esp_audio_effects:
    version: "~1.3.0"
